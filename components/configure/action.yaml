name: 'AnyKernel3 Configure Script'
description: 'Configure anykernel.sh global properties, boot shell variables, and install modes.'

inputs:
  staging-dir:
    description: 'Prepared AnyKernel3 staging directory'
    required: true
  config-file:
    description: 'Optional JSON, TOML, or .properties file'
    required: false
    default: ''
  anykernel-script:
    description: 'Optional custom anykernel.sh template path'
    required: false
    default: ''
  kernel-string:
    description: 'kernel.string property'
    required: false
    default: ''
  do-devicecheck:
    description: 'do.devicecheck property (0/1 or false/true)'
    required: false
    default: ''
  do-modules:
    description: 'do.modules property (0/1 or false/true)'
    required: false
    default: ''
  do-systemless:
    description: 'do.systemless property (0/1 or false/true)'
    required: false
    default: ''
  do-cleanup:
    description: 'do.cleanup property (0/1 or false/true)'
    required: false
    default: ''
  do-cleanuponabort:
    description: 'do.cleanuponabort property (0/1 or false/true)'
    required: false
    default: ''
  device-names:
    description: 'Comma, space, or newline separated device.name# list'
    required: false
    default: ''
  supported-versions:
    description: 'supported.versions property'
    required: false
    default: ''
  supported-patchlevels:
    description: 'supported.patchlevels property'
    required: false
    default: ''
  supported-vendorpatchlevels:
    description: 'supported.vendorpatchlevels property'
    required: false
    default: ''
  extra-properties:
    description: 'Additional key=value lines for properties()'
    required: false
    default: ''
  block:
    description: 'BLOCK shell variable'
    required: false
    default: ''
  is-slot-device:
    description: 'IS_SLOT_DEVICE (0, 1, auto)'
    required: false
    default: ''
  ramdisk-compression:
    description: 'RAMDISK_COMPRESSION (auto, gz, lz4, ...)'
    required: false
    default: ''
  patch-vbmeta-flag:
    description: 'PATCH_VBMETA_FLAG (auto, 0, 1)'
    required: false
    default: ''
  custom-dd:
    description: 'CUSTOMDD shell variable'
    required: false
    default: ''
  slot-select:
    description: 'SLOT_SELECT (active, inactive)'
    required: false
    default: ''
  no-block-display:
    description: 'Set NO_BLOCK_DISPLAY=1 when true'
    required: false
    default: ''
  no-magisk-check:
    description: 'Set NO_MAGISK_CHECK=1 when true'
    required: false
    default: ''
  no-vbmeta-partition-patch:
    description: 'Set NO_VBMETA_PARTITION_PATCH=1 when true'
    required: false
    default: ''
  install-mode:
    description: 'dump_write, split_flash, or keep'
    required: false
    default: ''
  strip-example-patches:
    description: 'Strip upstream tuna sample patches'
    required: false
    default: ''
  boot-attributes:
    description: 'Override body for boot_attributes()'
    required: false
    default: ''
  ramdisk-patch-commands:
    description: 'Optional AnyKernel3 commands inserted into boot install'
    required: false
    default: ''
  flash-generic:
    description: 'Extra partitions to flash via flash_generic in split_flash mode'
    required: false
    default: ''
  extra-partitions:
    description: 'JSON array of additional partition blocks'
    required: false
    default: ''
  strict:
    description: 'Fail validation on upstream placeholder values'
    required: false
    default: 'false'
  python-bin:
    description: 'Python 3 executable name or path'
    required: false
    default: 'python3'

outputs:
  kernel-string:
    description: 'Configured kernel.string property'
    value: ${{ steps.run.outputs.kernel-string }}
  device-names:
    description: 'Configured comma-separated device names'
    value: ${{ steps.run.outputs.device-names }}

runs:
  using: 'composite'
  steps:
    - name: Configure anykernel.sh
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PYTHON_BIN: ${{ inputs.python-bin }}
        INPUT_STAGING-DIR: ${{ inputs.staging-dir }}
        INPUT_CONFIG-FILE: ${{ inputs.config-file }}
        INPUT_ANYKERNEL-SCRIPT: ${{ inputs.anykernel-script }}
        INPUT_KERNEL-STRING: ${{ inputs.kernel-string }}
        INPUT_DO-DEVICECHECK: ${{ inputs.do-devicecheck }}
        INPUT_DO-MODULES: ${{ inputs.do-modules }}
        INPUT_DO-SYSTEMLESS: ${{ inputs.do-systemless }}
        INPUT_DO-CLEANUP: ${{ inputs.do-cleanup }}
        INPUT_DO-CLEANUPONABORT: ${{ inputs.do-cleanuponabort }}
        INPUT_DEVICE-NAMES: ${{ inputs.device-names }}
        INPUT_SUPPORTED-VERSIONS: ${{ inputs.supported-versions }}
        INPUT_SUPPORTED-PATCHLEVELS: ${{ inputs.supported-patchlevels }}
        INPUT_SUPPORTED-VENDORPATCHLEVELS: ${{ inputs.supported-vendorpatchlevels }}
        INPUT_EXTRA-PROPERTIES: ${{ inputs.extra-properties }}
        INPUT_BLOCK: ${{ inputs.block }}
        INPUT_IS-SLOT-DEVICE: ${{ inputs.is-slot-device }}
        INPUT_RAMDISK-COMPRESSION: ${{ inputs.ramdisk-compression }}
        INPUT_PATCH-VBMETA-FLAG: ${{ inputs.patch-vbmeta-flag }}
        INPUT_CUSTOM-DD: ${{ inputs.custom-dd }}
        INPUT_SLOT-SELECT: ${{ inputs.slot-select }}
        INPUT_NO-BLOCK-DISPLAY: ${{ inputs.no-block-display }}
        INPUT_NO-MAGISK-CHECK: ${{ inputs.no-magisk-check }}
        INPUT_NO-VBMETA-PARTITION-PATCH: ${{ inputs.no-vbmeta-partition-patch }}
        INPUT_INSTALL-MODE: ${{ inputs.install-mode }}
        INPUT_STRIP-EXAMPLE-PATCHES: ${{ inputs.strip-example-patches }}
        INPUT_BOOT-ATTRIBUTES: ${{ inputs.boot-attributes }}
        INPUT_RAMDISK-PATCH-COMMANDS: ${{ inputs.ramdisk-patch-commands }}
        INPUT_FLASH-GENERIC: ${{ inputs.flash-generic }}
        INPUT_EXTRA-PARTITIONS: ${{ inputs.extra-partitions }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        "${PYTHON_BIN:-python3}" "$ACTION_PATH/../../main.py" configure

