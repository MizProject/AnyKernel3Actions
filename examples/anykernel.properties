# AnyKernel3 properties & shell variable config
kernel.string=ExampleKernel {kernel_version}
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.names=alioth,aliothin
supported.versions=13 - 15
supported.patchlevels=2024-01 -

# Required: Point to your device's full boot partition path without _a/_b slot suffix
# Common examples:
#   Qualcomm: /dev/block/bootdevice/by-name/boot
#   SoC-specific: /dev/block/platform/<controller>/by-name/boot
#   Generic symlink: /dev/block/by-name/boot
block=/dev/block/bootdevice/by-name/boot

# Slot handling: 1 for A/B devices (boot_a / boot_b), 0 for non-A/B single boot, auto to detect
is-slot-device=1
ramdisk-compression=auto
patch-vbmeta-flag=auto
install-mode=dump_write
strip-example-patches=true
